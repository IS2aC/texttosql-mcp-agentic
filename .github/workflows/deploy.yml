name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Calcul du nom de repo en minuscules ───────────
      - name: Compute lowercase repo name
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # ── 3. Setup Buildx ───────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Login ghcr.io ─────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Build & push MCP server ───────────────────────
      - name: Build and push MCP server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: server/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/mcp-server:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/mcp-server:${{ github.sha }}

      # ── 6. Build & push client web ───────────────────────
      - name: Build and push client web image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: client/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/client-web:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/client-web:${{ github.sha }}

      # ── 7. Deploy sur la VM via SSH ──────────────────────
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: REPO_LOWER
          script: |
            set -e

            APP_DIR="/home/debian/analytics-assistant"
            mkdir -p $APP_DIR
            cd $APP_DIR

            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cat > docker-compose.yml << COMPOSE
            services:
              server:
                image: ghcr.io/${{ env.REPO_LOWER }}/mcp-server:latest
                container_name: mcp-server
                environment:
                  - OLLAMA_HOST=http://host.docker.internal:11434
                  - FASTMCP_HOST=0.0.0.0
                  - FASTMCP_PORT=8000
                env_file: [.env]
                ports: ["49154:8000"]
                extra_hosts:
                  - "host.docker.internal:host-gateway"
                restart: unless-stopped
                networks: [internal]
                healthcheck:
                  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/sse')"]
                  interval: 10s
                  timeout: 5s
                  retries: 10
                  start_period: 15s

              client:
                image: ghcr.io/${{ env.REPO_LOWER }}/client-web:latest
                container_name: mcp-client
                environment:
                  - MCP_SERVER_URL=http://server:8000/sse
                  - OLLAMA_HOST=http://host.docker.internal:11434
                env_file: [.env]
                volumes:
                  - prompts_data:/app/web/system_prompts
                ports: ["49153:5050"]
                extra_hosts:
                  - "host.docker.internal:host-gateway"
                depends_on:
                  server:
                    condition: service_healthy
                restart: unless-stopped
                networks: [internal]

            volumes:
              prompts_data:

            networks:
              internal:
                driver: bridge
            COMPOSE

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            echo "✅ Déploiement terminé — $(date)"