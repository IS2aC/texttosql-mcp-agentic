name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Calcul du nom de repo en minuscules ───────────
      - name: Compute lowercase repo name
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # ── 3. Setup Buildx ───────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Login ghcr.io ─────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Build & push MCP server ───────────────────────
      - name: Build and push MCP server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: server/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/mcp-server:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/mcp-server:${{ github.sha }}

      # ── 6. Build & push client web ───────────────────────
      - name: Build and push client web image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: client/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/client-web:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/client-web:${{ github.sha }}

      # ── 7. Copie des fichiers compose vers la VM ─────────
      - name: Copy compose files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: "/home/debian/analytics-assistant"
          strip_components: 0

      # ── 8. Deploy sur la VM via SSH ──────────────────────
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: REPO_LOWER,REGISTRY
          script: |
            set -e
            cd /home/debian/analytics-assistant

            export REGISTRY="${{ env.REGISTRY }}"
            export REPO_LOWER="${{ env.REPO_LOWER }}"

            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

            echo "✅ Déploiement terminé — $(date)"