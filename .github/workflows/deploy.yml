name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # permet de déclencher manuellement depuis GitHub

env:
  REGISTRY: ghcr.io
  # Transforme en minuscules (requis par ghcr.io)
  REPO_LOWER: ${{ github.repository_owner }}/${{ github.event.repository.name }}

  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Calcul du nom de repo en minuscules ───────────
      - name: Compute lowercase repo name
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # ── 3. Login ghcr.io ─────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Build & push MCP server ───────────────────────
      - name: Build and push MCP server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/mcp-server:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/mcp-server:${{ github.sha }}

      # ── 5. Build & push client web ───────────────────────
      - name: Build and push client web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: client/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/client-web:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/client-web:${{ github.sha }}