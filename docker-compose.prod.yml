# docker-compose.prod.yml
# Override de production : remplace le build local par les images publiées sur ghcr.io
# et adapte les ports exposés sur l'hôte.
#
# Usage :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # ── MCP Server ────────────────────────────────────────────────────────────
  server:
    container_name: mcp-server
    build: !reset null
    image: ghcr.io/is2ac/texttosql-mcp-agentic/mcp-server:latest
    ports:
      - "49154:8000"

  # ── Client Web (Flask) ────────────────────────────────────────────────────
  client:
    container_name: mcp-client
    build: !reset null
    image: ghcr.io/is2ac/texttosql-mcp-agentic/client-web:latest
    ports:
      - "49153:5050"